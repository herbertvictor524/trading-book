<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d12">
  <title>Trading Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 8-9"/></svg></span><h1>Trading Book</h1></div>
    <div class="prefs">
      <label>Theme
        <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select>
      </label>
      <label>Accent <input type="color" id="accent" value="#4c8dff"></label>
      <label>Text size
        <select id="size"><option value="14">Small</option><option value="16">Medium</option><option value="18">Large</option></select>
      </label>
    </div>
  </header>

  <main class="grid">
    <section class="col" aria-label="Your book">
      <div class="panel hero">
        <div class="ring" id="ring"><div class="ring-in"><div class="big" id="winRate">–</div><div class="muted">win rate</div></div></div>
        <dl class="kv">
          <div><dt>Trades</dt><dd id="count">0</dd></div>
          <div><dt>Net P/L</dt><dd id="pnl">0</dd></div>
          <div><dt>Average win</dt><dd id="avgWin">–</dd></div>
          <div><dt>Average loss</dt><dd id="avgLoss">–</dd></div>
        </dl>
      </div>

      <p class="coach" id="coach" aria-live="polite"></p>

      <form class="panel form" id="tradeForm">
        <h2>Log a trade</h2>
        <label>Asset <input name="asset" list="assets" placeholder="BTCUSDT" required></label>
        <label>Side
          <select name="side"><option value="long">Long</option><option value="short">Short</option></select>
        </label>
        <label>Entry price <input name="entry" type="number" step="any" min="0" required></label>
        <label>Exit price <input name="exit" type="number" step="any" min="0" required></label>
        <label>Size <input name="size" type="number" step="any" min="0" value="1" required></label>
        <button type="submit">Add trade</button>
        <datalist id="assets"></datalist>
      </form>

      <div class="panel">
        <h2>Trades</h2>
        <div class="scroll">
          <table>
            <thead><tr><th>Asset</th><th>Side</th><th>Entry</th><th>Exit</th><th>Size</th><th>P/L</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="muted empty" id="empty">No trades yet. Add one above.</p>
      </div>
    </section>

    <section class="col" aria-label="Market">
      <div class="panel">
        <div class="chart-head">
          <span class="live" aria-hidden="true"></span><h2>Live chart</h2>
          <select id="symbol" aria-label="Chart asset"></select>
          <span class="price" id="price">–</span>
        </div>
        <canvas id="chart" role="img" aria-label="Price chart for the last 2 hours"></canvas>
        <p class="muted small" id="status">Connecting…</p>
      </div>

      <div class="panel">
        <h2>Highest 24h yield</h2>
        <ul class="list" id="yield"></ul>
      </div>

      <div class="panel">
        <h2>Trade ideas</h2>
        <ul class="list" id="ideas"></ul>
        <p class="muted small">Simple momentum rules, not financial advice.</p>
      </div>
    </section>
  </main>

  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
